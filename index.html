<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>受付状況</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        "Yu Gothic UI",
        "Meiryo",
        sans-serif;
}

header {
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    padding: 20px 16px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

#eventName {
    margin-top: 6px;
    font-size: 15px;
    color: #666;
}

.status-area {
    max-width: 900px;
    margin: 16px auto;
    padding: 0 12px;
}

.update-area {
    background: white;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

#lastUpdate {
    font-size: 14px;
    color: #666;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 9px 18px;
    font-size: 15px;
    cursor: pointer;
    background: #222;
    color: white;
}

.room {
    background: white;
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.room-title {
    font-size: 22px;
    font-weight: bold;
    padding: 15px 18px;
    background: #eceff1;
}

.session {
    padding: 15px 18px;
    border-top: 1px solid #eee;
}

.session-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.speaker {
    display: flex;
    align-items: center;
    padding: 11px 0;
    border-top: 1px solid #f0f0f0;
}

.speaker:first-of-type {
    border-top: none;
}

.number {
    width: 75px;
    flex-shrink: 0;
    font-weight: bold;
}

.name {
    flex: 1;
    font-size: 17px;
}

.received {
    font-weight: bold;
    color: #087f23;
    white-space: nowrap;
}

.received::before {
    content: "●";
    margin-right: 5px;
}

.preregistered {
    font-weight: bold;
    color: #b77900;
    white-space: nowrap;
}

.preregistered::before {
    content: "●";
    margin-right: 5px;
}

.pending {
    font-weight: bold;
    color: #666;
    white-space: nowrap;
}
.pending::before {
    content: "○";
    margin-right: 5px;
}

.finished {
    font-weight: bold;
    color: #222;
    white-space: nowrap;
}
.finished::before {
    content: "●";
    margin-right: 5px;
}

.loading,
.empty,
.error {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
}

.error {
    color: #b00020;
}

footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 12px;
}


.filter-area {
    background: #fff;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 15px;
}
.filter-title {
    font-weight: bold;
    margin-bottom: 10px;
}
.filter-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 10px;
}
.filter-grid label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
}
.filter-grid select {
    width: 100%;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: #fff;
}
.path {
    font-size: 12px;
    color: #777;
    margin-top: 3px;
}
.date-title {
    font-size: 20px;
    font-weight: bold;
    margin: 18px 2px 10px;
}

.tree-area {
    background: #fff;
    border-radius: 12px;
    padding: 10px 18px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.tree-node { border-top: 1px solid #eee; }
.tree-node:first-child { border-top: 0; }
.tree-toggle {
    width: 100%;
    background: transparent;
    color: #222;
    border: 0;
    border-radius: 0;
    text-align: left;
    padding: 14px 8px;
    font-weight: 700;
    cursor: pointer;
}
.tree-toggle:hover { background: #f7f8f9; }
.tree-date > .tree-toggle { font-size: 22px; }
.tree-room > .tree-toggle { font-size: 19px; padding-left: 28px; }
.tree-session > .tree-toggle { font-size: 17px; padding-left: 50px; }
.tree-arrow {
    display: inline-block;
    width: 22px;
    margin-right: 5px;
    transition: transform .15s ease;
}
.tree-open > .tree-toggle .tree-arrow { transform: rotate(90deg); }
.tree-children { display: none; }
.tree-open > .tree-children { display: block; }
.tree-speaker {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 10px 11px 78px;
    border-top: 1px solid #f2f2f2;
}
.tree-speaker .number { width: 65px; }
.tree-speaker .name { flex: 1; }
.tree-empty {
    padding: 12px 10px 12px 78px;
    color: #888;
    border-top: 1px solid #f2f2f2;
}
@media (max-width: 600px) {
    .tree-room > .tree-toggle { padding-left: 18px; }
    .tree-session > .tree-toggle { padding-left: 34px; }
    .tree-speaker { padding-left: 48px; }
    .tree-empty { padding-left: 48px; }
}

@media (max-width: 600px) {
    .filter-grid { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {

    header h1 {
        font-size: 22px;
    }

    .room-title {
        font-size: 20px;
    }

    .session-title {
        font-size: 17px;
    }

    .number {
        width: 60px;
    }

    .name {
        font-size: 16px;
    }

    .received {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <h1>受付状況</h1>
    <div id="eventName"></div>
</header>

<main class="status-area">

    <div class="update-area">
        <div id="lastUpdate">読み込み中...</div>
        <button onclick="loadReception()">更新</button>
    </div>

    <div style="font-size:13px;color:#666;margin:0 2px 12px;">
        日付の▶を押すと会場、会場の▶を押すとセッション、セッションの▶を押すと演者を表示します。
        <br>● 緑：受付済み　● 黄：事前登録　○：未受付
    </div>

    <div id="content" class="tree-area">
        <div class="loading">受付状況を読み込んでいます...</div>
    </div>

</main>

<footer>
    Reception Status System
</footer>

<script>

/* ==========================================
   Supabase設定
========================================== */

const SUPABASE_URL =
    "https://bwxlexxgiwknezvwgogi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jve0-G7Y7-00jsq-jn-w1Q_XLRl72_V";


/* ==========================================
   URLからイベントID取得

   例:
   ?event=Test_reception
========================================== */

const params =
    new URLSearchParams(window.location.search);

const EVENT_ID =
    params.get("event") || "0920_test学会";


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHtml(value) {

    if (value === null || value === undefined)
        return "";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ==========================================
   演題番号の自然順ソート
========================================== */

function naturalCompare(a, b) {

    return String(a || "").localeCompare(
        String(b || ""),
        "ja",
        {
            numeric: true,
            sensitivity: "base"
        }
    );
}


/* ==========================================
   Supabaseから受付情報取得
========================================== */

let receptionData = [];
let hierarchyData = [];
const TREE_STORAGE_KEY = "kyoeisha_open_tree_" + EVENT_ID;

function loadOpenTreeNodes() {
    try {
        return new Set(JSON.parse(localStorage.getItem(TREE_STORAGE_KEY) || "[]"));
    } catch (_) {
        return new Set();
    }
}

const openTreeNodes = loadOpenTreeNodes();

function saveOpenTreeNodes() {
    try {
        localStorage.setItem(TREE_STORAGE_KEY, JSON.stringify([...openTreeNodes]));
    } catch (_) {}
}

function statusInfo(row) {
    if (row && (row.status === "received" || row.received === true))
        return {cls:"received", text:"受付済み"};
    if (row && row.status === "preregistered")
        return {cls:"preregistered", text:"事前登録"};
    if (row && (row.status === "finished" || row.finished === true))
        return {cls:"finished", text:"終了"};
    return {cls:"pending", text:"未受付"};
}

function nodeKey(parts) {
    return parts.map(x => String(x || "")).join("|||");
}

function renderTree() {
    const content = document.getElementById("content");

    const dates = {};
    hierarchyData.forEach(h => {
        const d = h.date || "";
        if (!d) return;
        if (!dates[d]) dates[d] = {};
        const r = h.room || "";
        if (r && !dates[d][r]) dates[d][r] = new Set();
        if (r && h.session) dates[d][r].add(h.session);
    });

    // Speaker data can fill gaps if hierarchy table has not caught up yet.
    receptionData.forEach(row => {
        const d = row.date || "";
        const r = row.room || "";
        const s = row.session || "";
        if (!d) return;
        if (!dates[d]) dates[d] = {};
        if (r && !dates[d][r]) dates[d][r] = new Set();
        if (r && s) dates[d][r].add(s);
    });

    const dateNames = Object.keys(dates).sort(naturalCompare);

    // 現在存在する階層キーだけを残す。10秒更新でも展開状態を維持する。
    const validKeys = new Set();
    dateNames.forEach(date => {
        validKeys.add(nodeKey([date]));
        Object.keys(dates[date]).forEach(room => {
            validKeys.add(nodeKey([date, room]));
            [...dates[date][room]].forEach(session => {
                validKeys.add(nodeKey([date, room, session]));
            });
            const directExists = receptionData.some(x =>
                String(x.date||"") === date &&
                String(x.room||"") === room &&
                !String(x.session||"")
            );
            if (directExists) validKeys.add(nodeKey([date, room, ""]));
        });
    });
    [...openTreeNodes].forEach(key => {
        if (!validKeys.has(key)) openTreeNodes.delete(key);
    });
    saveOpenTreeNodes();

    if (!dateNames.length) {
        content.innerHTML = '<div class="empty">現在、登録されている階層はありません。</div>';
        return;
    }

    let html = "";

    dateNames.forEach(date => {
        const dateKey = nodeKey([date]);
        html += '<div class="tree-node tree-date' + (openTreeNodes.has(dateKey) ? ' tree-open' : '') + '" data-key="' + escapeHtml(dateKey) + '">';
        html += '<button class="tree-toggle" type="button"><span class="tree-arrow">▶</span>' + escapeHtml(date) + '</button>';
        html += '<div class="tree-children">';

        const rooms = Object.keys(dates[date]).sort(naturalCompare);
        rooms.forEach(room => {
            const roomKey = nodeKey([date,room]);
            html += '<div class="tree-node tree-room' + (openTreeNodes.has(roomKey) ? ' tree-open' : '') + '" data-key="' + escapeHtml(roomKey) + '">';
            html += '<button class="tree-toggle" type="button"><span class="tree-arrow">▶</span>' + escapeHtml(room) + '</button>';
            html += '<div class="tree-children">';

            let sessions = [...dates[date][room]].sort(naturalCompare);
            const directSpeakers = receptionData.filter(x =>
                String(x.date||"") === date &&
                String(x.room||"") === room &&
                !String(x.session||"")
            );

            // Speakers directly under room are shown in a virtual "演者" section.
            if (directSpeakers.length) sessions = ["", ...sessions];

            if (!sessions.length) {
                html += '<div class="tree-empty">セッションはまだ登録されていません。</div>';
            }

            sessions.forEach(session => {
                const label = session || "演者";
                const sessionKey = nodeKey([date,room,session]);
                html += '<div class="tree-node tree-session' + (openTreeNodes.has(sessionKey) ? ' tree-open' : '') + '" data-key="' + escapeHtml(sessionKey) + '">';
                html += '<button class="tree-toggle" type="button"><span class="tree-arrow">▶</span>' + escapeHtml(label) + '</button>';
                html += '<div class="tree-children">';

                const speakers = receptionData.filter(x =>
                    String(x.date||"") === date &&
                    String(x.room||"") === room &&
                    String(x.session||"") === session
                ).sort((a,b) => naturalCompare(a.number,b.number));

                if (!speakers.length) {
                    html += '<div class="tree-empty">演者はまだ登録されていません。</div>';
                } else {
                    speakers.forEach(row => {
                        const st = statusInfo(row);
                        html += '<div class="tree-speaker">' +
                            '<div class="number">' + escapeHtml(row.number) + '</div>' +
                            '<div class="name">' + escapeHtml(row.speaker) + '</div>' +
                            '<div class="' + st.cls + '">' + st.text + '</div>' +
                            '</div>';
                    });
                }

                html += '</div></div>';
            });

            html += '</div></div>';
        });

        if (!rooms.length) html += '<div class="tree-empty">会場はまだ登録されていません。</div>';
        html += '</div></div>';
    });

    content.innerHTML = html;

    content.querySelectorAll(".tree-toggle").forEach(btn => {
        btn.addEventListener("click", () => {
            const node = btn.parentElement;
            const key = node.dataset.key;
            const willOpen = !node.classList.contains("tree-open");
            node.classList.toggle("tree-open");

            if (willOpen) openTreeNodes.add(key);
            else openTreeNodes.delete(key);
            saveOpenTreeNodes();
        });
    });
}

async function loadReception() {
    const content = document.getElementById("content");
    const lastUpdate = document.getElementById("lastUpdate");
    document.getElementById("eventName").textContent = EVENT_ID;
    lastUpdate.textContent = "更新しています...";

    try {
        const eventFilter = encodeURIComponent(EVENT_ID);
        const statusUrl = SUPABASE_URL + "/rest/v1/reception_status?select=*" +
            "&event_id=eq." + eventFilter;
        const hierarchyUrl = SUPABASE_URL + "/rest/v1/reception_hierarchy?select=*" +
            "&event_id=eq." + eventFilter;

        const [statusResponse, hierarchyResponse] = await Promise.all([
            fetch(statusUrl, {headers:{"apikey":SUPABASE_KEY}, cache:"no-store"}),
            fetch(hierarchyUrl, {headers:{"apikey":SUPABASE_KEY}, cache:"no-store"})
        ]);

        if (!statusResponse.ok) throw new Error(statusResponse.status + " " + await statusResponse.text());
        if (!hierarchyResponse.ok) throw new Error(hierarchyResponse.status + " " + await hierarchyResponse.text());

        receptionData = await statusResponse.json();
        hierarchyData = await hierarchyResponse.json();

        renderTree();

        const latest = [...receptionData, ...hierarchyData]
            .map(x => x.updated_at).filter(Boolean).sort().pop();
        lastUpdate.textContent = latest
            ? "データ更新 " + new Date(latest).toLocaleString("ja-JP")
            : "最終確認 " + new Date().toLocaleTimeString("ja-JP");
    } catch(error) {
        console.error(error);
        content.innerHTML = '<div class="error">受付情報を取得できません。<br>しばらくしてから更新してください。</div>';
        lastUpdate.textContent = "通信エラー";
    }
}


/* ==========================================
   初回読み込み
========================================== */

loadReception();


/* ==========================================
   10秒ごとに自動更新
========================================== */

setInterval(
    loadReception,
    10000
);

</script>

</body>
</html>
