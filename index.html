<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>受付状況</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        "Yu Gothic UI",
        "Meiryo",
        sans-serif;
}

header {
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    padding: 20px 16px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

#eventName {
    margin-top: 6px;
    font-size: 15px;
    color: #666;
}

.status-area {
    max-width: 900px;
    margin: 16px auto;
    padding: 0 12px;
}

.update-area {
    background: white;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

#lastUpdate {
    font-size: 14px;
    color: #666;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 9px 18px;
    font-size: 15px;
    cursor: pointer;
    background: #222;
    color: white;
}

.room {
    background: white;
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.room-title {
    font-size: 22px;
    font-weight: bold;
    padding: 15px 18px;
    background: #eceff1;
}

.session {
    padding: 15px 18px;
    border-top: 1px solid #eee;
}

.session-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.speaker {
    display: flex;
    align-items: center;
    padding: 11px 0;
    border-top: 1px solid #f0f0f0;
}

.speaker:first-of-type {
    border-top: none;
}

.number {
    width: 75px;
    flex-shrink: 0;
    font-weight: bold;
}

.name {
    flex: 1;
    font-size: 17px;
}

.received {
    font-weight: bold;
    color: #087f23;
    white-space: nowrap;
}

.received::before {
    content: "●";
    margin-right: 5px;
}

.preregistered {
    font-weight: bold;
    color: #b77900;
    white-space: nowrap;
}

.preregistered::before {
    content: "●";
    margin-right: 5px;
}

.pending {
    font-weight: bold;
    color: #666;
    white-space: nowrap;
}
.pending::before {
    content: "○";
    margin-right: 5px;
}

.finished {
    font-weight: bold;
    color: #222;
    white-space: nowrap;
}
.finished::before {
    content: "●";
    margin-right: 5px;
}

.loading,
.empty,
.error {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
}

.error {
    color: #b00020;
}

footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 12px;
}


.filter-area {
    background: #fff;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 15px;
}
.filter-title {
    font-weight: bold;
    margin-bottom: 10px;
}
.filter-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 10px;
}
.filter-grid label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
}
.filter-grid select {
    width: 100%;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: #fff;
}
.path {
    font-size: 12px;
    color: #777;
    margin-top: 3px;
}
.date-title {
    font-size: 20px;
    font-weight: bold;
    margin: 18px 2px 10px;
}

.tree-area {
    background: #fff;
    border-radius: 12px;
    padding: 10px 18px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.tree-node { border-top: 1px solid #eee; }
.tree-node:first-child { border-top: 0; }
.tree-toggle {
    width: 100%;
    background: transparent;
    color: #222;
    border: 0;
    border-radius: 0;
    text-align: left;
    padding: 14px 8px;
    font-weight: 700;
    cursor: pointer;
}
.tree-toggle:hover { background: #f7f8f9; }
.tree-date > .tree-toggle { font-size: 22px; }
.tree-room > .tree-toggle { font-size: 19px; padding-left: 28px; }
.tree-session > .tree-toggle { font-size: 17px; padding-left: 50px; }
.tree-arrow {
    display: inline-block;
    width: 22px;
    margin-right: 5px;
    transition: transform .15s ease;
}
.tree-open > .tree-toggle .tree-arrow { transform: rotate(90deg); }
.tree-children { display: none; }
.tree-open > .tree-children { display: block; }
.tree-speaker {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 10px 11px 78px;
    border-top: 1px solid #f2f2f2;
}
.tree-speaker .number { width: 65px; }
.tree-speaker .name { flex: 1; }
.tree-empty {
    padding: 12px 10px 12px 78px;
    color: #888;
    border-top: 1px solid #f2f2f2;
}
@media (max-width: 600px) {
    .tree-room > .tree-toggle { padding-left: 18px; }
    .tree-session > .tree-toggle { padding-left: 34px; }
    .tree-speaker { padding-left: 48px; }
    .tree-empty { padding-left: 48px; }
}

@media (max-width: 600px) {
    .filter-grid { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {

    header h1 {
        font-size: 22px;
    }

    .room-title {
        font-size: 20px;
    }

    .session-title {
        font-size: 17px;
    }

    .number {
        width: 60px;
    }

    .name {
        font-size: 16px;
    }

    .received {
        font-size: 14px;
    }
}

/* ===== V30 smartphone responsive UI ===== */
html {
    -webkit-text-size-adjust: 100%;
}
body {
    overflow-x: hidden;
}
.tree-toggle {
    min-height: 48px;
    touch-action: manipulation;
}
.tree-speaker {
    min-height: 48px;
}
@media (max-width: 600px) {
    header {
        padding: 14px 10px;
    }
    header h1 {
        font-size: 21px;
    }
    #eventName {
        font-size: 13px;
    }
    .status-area {
        margin: 10px auto;
        padding: 0 8px;
    }
    .update-area {
        padding: 10px 12px;
        border-radius: 9px;
    }
    #lastUpdate {
        font-size: 12px;
        line-height: 1.4;
    }
    .update-area button {
        padding: 9px 14px;
        font-size: 14px;
        flex-shrink: 0;
    }
    .tree-area {
        padding: 4px 8px 12px;
        border-radius: 9px;
    }
    .tree-date > .tree-toggle {
        font-size: 19px;
        padding: 13px 4px;
    }
    .tree-room > .tree-toggle {
        font-size: 17px;
        padding: 12px 4px 12px 18px;
    }
    .tree-session > .tree-toggle {
        font-size: 15px;
        padding: 11px 4px 11px 32px;
    }
    .tree-arrow {
        width: 18px;
        margin-right: 3px;
    }
    .tree-speaker {
        padding: 10px 4px 10px 44px;
        gap: 5px;
    }
    .tree-speaker .number {
        width: 42px;
        font-size: 13px;
        flex-shrink: 0;
    }
    .tree-speaker .name {
        min-width: 0;
        font-size: 15px;
        line-height: 1.35;
        overflow-wrap: anywhere;
    }
    .tree-speaker .received,
    .tree-speaker .preregistered,
    .tree-speaker .pending,
    .tree-speaker .finished {
        font-size: 12px;
        flex-shrink: 0;
        margin-left: 4px;
    }
    .tree-empty {
        padding: 11px 5px 11px 44px;
        font-size: 13px;
    }
    footer {
        padding: 14px 8px;
    }
}
@media (max-width: 380px) {
    .tree-speaker {
        padding-left: 34px;
    }
    .tree-speaker .number {
        width: 36px;
    }
    .tree-speaker .name {
        font-size: 14px;
    }
    .tree-speaker .received,
    .tree-speaker .preregistered,
    .tree-speaker .pending,
    .tree-speaker .finished {
        font-size: 11px;
    }
}


    .event-select-area select { min-height:44px; }
}
</style>
</head>

<body>

<header>
    <h1>受付状況</h1>
    <div id="eventName">受付状況を確認しています...</div>
</header>

<main class="status-area">

    <div class="update-area">
        <div id="lastUpdate">読み込み中...</div>
        <button onclick="loadReception()">更新</button>
    </div>

    <div style="font-size:13px;color:#666;margin:0 2px 12px;">
        ▶をタップすると、日付 → 会場 → セッション → 演者の順に開きます。
        <br>● 緑：受付済み　● 黄：事前登録　○：未受付
    </div>

    <div id="content" class="tree-area">
        <div class="loading">受付状況を読み込んでいます...</div>
    </div>

</main>

<footer>
    Reception Status System
</footer>

<script>

/* ==========================================
   Supabase設定
========================================== */

const SUPABASE_URL =
    "https://bwxlexxgiwknezvwgogi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jve0-G7Y7-00jsq-jn-w1Q_XLRl72_V";


/* ==========================================
   URLからイベントID取得

   例:
   ?event=Test_reception
========================================== */

const params =
    new URLSearchParams(window.location.search);

let EVENT_ID = params.get("event") || "";

// 専用URL方式：URLに含まれるイベントID以外は取得しない。
// 不正な文字を含むIDは無効として扱う。
if (EVENT_ID && !/^[A-Za-z0-9_-]{8,80}$/.test(EVENT_ID)) {
    EVENT_ID = "";
}


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHtml(value) {

    if (value === null || value === undefined)
        return "";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ==========================================
   演題番号の自然順ソート
========================================== */

function naturalCompare(a, b) {

    return String(a || "").localeCompare(
        String(b || ""),
        "ja",
        {
            numeric: true,
            sensitivity: "base"
        }
    );
}


/* ==========================================
   Supabaseから受付情報取得
========================================== */

let receptionData = [];
let hierarchyData = [];

function statusInfo(row) {
    if (row && (row.status === "received" || row.received === true))
        return {cls:"received", text:"受付済み"};
    if (row && row.status === "preregistered")
        return {cls:"preregistered", text:"事前登録"};
    if (row && (row.status === "finished" || row.finished === true))
        return {cls:"finished", text:"終了"};
    return {cls:"pending", text:"未受付"};
}

function nodeKey(parts) {
    return parts.map(x => String(x || "")).join("|||");
}

function fetchWithTimeout(url, options={}, timeout=10000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    return fetch(url, {...options, signal: controller.signal})
        .finally(() => clearTimeout(timer));
}

function showError(message) {
    const content = document.getElementById("content");
    content.innerHTML =
        '<div class="error">' +
        escapeHtml(message) +
        '<br><button class="retry-button" onclick="initializePage()">再読み込み</button>' +
        '</div>';
    document.getElementById("lastUpdate").textContent = "通信エラー";
}

function makeToggle(label) {
    const btn = document.createElement("button");
    btn.className = "tree-toggle";
    btn.type = "button";
    const arrow = document.createElement("span");
    arrow.className = "tree-arrow";
    arrow.textContent = "▶";
    btn.appendChild(arrow);
    btn.appendChild(document.createTextNode(label));
    return btn;
}

function bindToggle(node, btn) {
    btn.addEventListener("click", () => node.classList.toggle("tree-open"));
}

function speakerElement(row) {
    const div = document.createElement("div");
    div.className = "tree-speaker";
    const number = document.createElement("div");
    number.className = "number";
    number.textContent = row.number || "";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = row.speaker || "";
    const st = statusInfo(row);
    const status = document.createElement("div");
    status.className = st.cls;
    status.textContent = st.text;
    div.append(number, name, status);
    return div;
}

function emptyElement(text) {
    const div = document.createElement("div");
    div.className = "tree-empty";
    div.textContent = text;
    return div;
}

function buildTreeModel() {
    const dates = {};
    hierarchyData.forEach(item => {
        const date = String(item.date || "");
        const room = String(item.room || "");
        const session = String(item.session || "");
        if (!date) return;
        if (!dates[date]) dates[date] = {};
        if (room && !dates[date][room]) dates[date][room] = new Set();
        if (room && session) dates[date][room].add(session);
    });
    receptionData.forEach(row => {
        const date = String(row.date || "");
        const room = String(row.room || "");
        const session = String(row.session || "");
        if (!date) return;
        if (!dates[date]) dates[date] = {};
        if (room && !dates[date][room]) dates[date][room] = new Set();
        if (room && session) dates[date][room].add(session);
    });
    return dates;
}

function renderTree() {
    const content = document.getElementById("content");
    const dates = buildTreeModel();
    const dateNames = Object.keys(dates).sort(naturalCompare);

    if (!dateNames.length) {
        content.innerHTML = '<div class="empty">現在、登録されている階層・演者はいません。</div>';
        return;
    }

    const existing = new Map();
    content.querySelectorAll(".tree-node[data-key]").forEach(el => existing.set(el.dataset.key, el));
    const wantedKeys = new Set();

    function getOrCreateNode(key, cls, label) {
        wantedKeys.add(key);
        let node = existing.get(key);
        if (!node) {
            node = document.createElement("div");
            node.className = "tree-node " + cls;
            node.dataset.key = key;
            const btn = makeToggle(label);
            const children = document.createElement("div");
            children.className = "tree-children";
            node.append(btn, children);
            bindToggle(node, btn);
        }
        return node;
    }

    const fragment = document.createDocumentFragment();

    dateNames.forEach(date => {
        const dateNode = getOrCreateNode(nodeKey([date]), "tree-date", date);
        const dateChildren = dateNode.querySelector(":scope > .tree-children");
        const roomFrag = document.createDocumentFragment();
        const rooms = Object.keys(dates[date]).sort(naturalCompare);

        rooms.forEach(room => {
            const roomNode = getOrCreateNode(nodeKey([date,room]), "tree-room", room);
            const roomChildren = roomNode.querySelector(":scope > .tree-children");
            const sessionFrag = document.createDocumentFragment();

            let sessions = [...dates[date][room]].sort(naturalCompare);
            const directSpeakers = receptionData.filter(x =>
                String(x.date||"") === date && String(x.room||"") === room && !String(x.session||"")
            );
            if (directSpeakers.length) sessions = ["", ...sessions];

            if (!sessions.length) {
                roomChildren.replaceChildren(emptyElement("セッションはまだ登録されていません。"));
            } else {
                sessions.forEach(session => {
                    const sessionNode = getOrCreateNode(
                        nodeKey([date,room,session]),
                        "tree-session",
                        session || "演者"
                    );
                    const sessionChildren = sessionNode.querySelector(":scope > .tree-children");
                    const speakers = receptionData.filter(x =>
                        String(x.date||"") === date &&
                        String(x.room||"") === room &&
                        String(x.session||"") === session
                    ).sort((a,b) => {
                        // V33: 演台番号を数字の自然順で表示する。
                        // number列が空の場合は speaker の先頭（例: SY1-6_氏名）から番号を取得。
                        // 「座長」など演台番号を持たない行は演者の後ろへ配置する。
                        const sortKey = row => {
                            const number = String(row.number || "").trim();
                            const speaker = String(row.speaker || "").trim();
                            const source = number || speaker;
                            const m = source.match(/^([A-Za-z]+\d*)[-_－ー]?\s*(\d+)/);
                            if (m) {
                                return {
                                    hasNumber: true,
                                    prefix: m[1],
                                    num: Number(m[2]),
                                    raw: source
                                };
                            }
                            return {
                                hasNumber: false,
                                prefix: "",
                                num: Number.MAX_SAFE_INTEGER,
                                raw: source
                            };
                        };

                        const ka = sortKey(a);
                        const kb = sortKey(b);

                        if (ka.hasNumber !== kb.hasNumber)
                            return ka.hasNumber ? -1 : 1;

                        const prefixCmp = naturalCompare(ka.prefix, kb.prefix);
                        if (prefixCmp !== 0) return prefixCmp;

                        if (ka.num !== kb.num) return ka.num - kb.num;

                        return naturalCompare(ka.raw, kb.raw);
                    });

                    const speakerFrag = document.createDocumentFragment();
                    if (!speakers.length) speakerFrag.appendChild(emptyElement("演者はまだ登録されていません。"));
                    else speakers.forEach(row => speakerFrag.appendChild(speakerElement(row)));

                    sessionChildren.replaceChildren(speakerFrag);
                    sessionFrag.appendChild(sessionNode);
                });
                roomChildren.replaceChildren(sessionFrag);
            }
            roomFrag.appendChild(roomNode);
        });

        if (!rooms.length) dateChildren.replaceChildren(emptyElement("会場はまだ登録されていません。"));
        else dateChildren.replaceChildren(roomFrag);

        fragment.appendChild(dateNode);
    });

    existing.forEach((node,key) => {
        if (!wantedKeys.has(key) && node.isConnected) node.remove();
    });
    content.replaceChildren(fragment);
}

async function loadReception() {
    if (!EVENT_ID) {
        document.getElementById("eventName").textContent = "イベントが指定されていません";
        document.getElementById("content").innerHTML =
            '<div class="empty">受付状況ページの専用URLを確認してください。<br><br>このページから他のイベントを検索・選択することはできません。</div>';
        document.getElementById("lastUpdate").textContent = "専用URLが必要です";
        return;
    }

    const lastUpdate = document.getElementById("lastUpdate");
    document.getElementById("eventName").textContent = "専用イベント";
    lastUpdate.textContent = "更新しています...";

    const eventFilter = encodeURIComponent(EVENT_ID);
    const statusUrl = SUPABASE_URL + "/rest/v1/reception_status?select=*" + "&event_id=eq." + eventFilter;
    const hierarchyUrl = SUPABASE_URL + "/rest/v1/reception_hierarchy?select=*" + "&event_id=eq." + eventFilter;

    const [statusResponse, hierarchyResponse] = await Promise.all([
        fetchWithTimeout(statusUrl, {headers:{"apikey":SUPABASE_KEY}, cache:"no-store"}),
        fetchWithTimeout(hierarchyUrl, {headers:{"apikey":SUPABASE_KEY}, cache:"no-store"})
    ]);

    if (!statusResponse.ok) throw new Error(statusResponse.status + " " + await statusResponse.text());
    if (!hierarchyResponse.ok) throw new Error(hierarchyResponse.status + " " + await hierarchyResponse.text());

    receptionData = await statusResponse.json();
    hierarchyData = await hierarchyResponse.json();
    renderTree();

    const latest = [...receptionData, ...hierarchyData]
        .map(x => x.updated_at).filter(Boolean).sort().pop();
    lastUpdate.textContent = latest
        ? "データ更新 " + new Date(latest).toLocaleString("ja-JP")
        : "最終確認 " + new Date().toLocaleTimeString("ja-JP");
}

async function initializePage() {
    try {
        await loadReception();
    } catch(error) {
        console.error(error);
        showError("受付情報を取得できません。通信環境を確認して再読み込みしてください。");
    }
}


/* ==========================================
   初回読み込み
========================================== */

initializePage();


/* ==========================================
   10秒ごとに自動更新
========================================== */

setInterval(() => {
    if (!EVENT_ID) return;
    loadReception().catch(error => {
        console.error(error);
        document.getElementById("lastUpdate").textContent = "更新失敗・次回再試行";
    });
}, 10000);

</script>

</body>
</html>
